<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="ar-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
    <marker id="ar-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cf222e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1280" height="760" fill="#ffffff"/>
  <text x="40" y="46" font-size="21" fill="#1f2328" font-weight="700">The executive loop - one iteration, then again, forever</text>
  <text x="40" y="70" font-size="13" fill="#57606a">Runs continuously on PM2 with no human in the inner loop: select the top goal, spawn a worker, verify the output, pick up the next. It sleeps only when the queue is empty.</text>

  <!-- legend -->
  <rect x="40" y="92" width="15" height="15" rx="3" fill="#ddf4ff" stroke="#0969da" stroke-width="1.3"/>
  <text x="62" y="104" font-size="12" fill="#57606a">AGENTIC - an LLM decides</text>
  <rect x="246" y="92" width="15" height="15" rx="3" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.3"/>
  <text x="268" y="104" font-size="12" fill="#57606a">DETERMINISTIC - plain code</text>

  <!-- ROW 1: 0.5 -> 1 -> 2 -> 3 -> 3b -->
  <rect x="40" y="150" width="210" height="84" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4"/>
  <text x="54" y="180" font-size="13.5" fill="#1f2328" font-weight="700">0.5 · Check inbox</text>
  <text x="54" y="202" font-size="11" fill="#57606a">Gmail inbox, opt-in</text>
  <text x="54" y="220" font-size="11" fill="#57606a">(new goals / approvals)</text>

  <rect x="280" y="150" width="210" height="84" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4"/>
  <text x="294" y="180" font-size="13.5" fill="#1f2328" font-weight="700">1 · Health check</text>
  <text x="294" y="202" font-size="11" fill="#57606a">auth · disk · deps;</text>
  <text x="294" y="220" font-size="11" fill="#57606a">rebuild goals.md index</text>

  <rect x="520" y="150" width="210" height="84" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4"/>
  <text x="534" y="180" font-size="13.5" fill="#1f2328" font-weight="700">2 · Process inputs</text>
  <text x="534" y="202" font-size="11" fill="#57606a">needs-you.md replies;</text>
  <text x="534" y="220" font-size="11" fill="#57606a">ingest queue.md (P3)</text>

  <rect x="760" y="150" width="210" height="84" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="774" y="180" font-size="13.5" fill="#0550ae" font-weight="700">3 · Select work</text>
  <text x="774" y="202" font-size="11" fill="#33445c">top unblocked goal,</text>
  <text x="774" y="220" font-size="11" fill="#33445c">P0 &gt; P1 &gt; ... &gt; P4</text>

  <rect x="1000" y="150" width="210" height="84" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="1014" y="180" font-size="13.5" fill="#0550ae" font-weight="700">3b · Breakdown</text>
  <text x="1014" y="202" font-size="11" fill="#33445c">only if &gt;100 turns:</text>
  <text x="1014" y="220" font-size="11" fill="#33445c">split into 2-5 steps</text>

  <!-- ROW 2: 4 <- (down from 3b) ; 4 -> 5 -> 6 -->
  <rect x="1000" y="330" width="210" height="84" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="1014" y="360" font-size="13.5" fill="#0550ae" font-weight="700">4 · Execute</text>
  <text x="1014" y="382" font-size="11" fill="#33445c">spawn worker (vendor),</text>
  <text x="1014" y="400" font-size="11" fill="#33445c">45-min wall-clock cap</text>

  <rect x="760" y="330" width="210" height="84" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4"/>
  <text x="774" y="360" font-size="13.5" fill="#1f2328" font-weight="700">5 · Validate</text>
  <text x="774" y="382" font-size="11" fill="#57606a">verifiers on output_path</text>
  <text x="774" y="400" font-size="11" fill="#57606a">(+ agentic read of result)</text>

  <rect x="520" y="330" width="210" height="84" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.4"/>
  <text x="534" y="360" font-size="13.5" fill="#1f2328" font-weight="700">6 · Update state</text>
  <text x="534" y="382" font-size="11" fill="#57606a">bundles · STEPS.json ·</text>
  <text x="534" y="400" font-size="11" fill="#57606a">ledgers · Notion / Discord</text>

  <!-- BRANCH ROW: 7 Diagnose, 8 Block -->
  <rect x="760" y="510" width="210" height="84" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.4"/>
  <text x="774" y="540" font-size="13.5" fill="#0550ae" font-weight="700">7 · Diagnose</text>
  <text x="774" y="562" font-size="11" fill="#33445c">root cause after 3+ fails;</text>
  <text x="774" y="580" font-size="11" fill="#33445c">retry vs escalate</text>

  <rect x="1000" y="510" width="210" height="84" rx="10" fill="#fff0f0" stroke="#cf222e" stroke-width="1.4"/>
  <text x="1014" y="540" font-size="13.5" fill="#a40e26" font-weight="700">8 · Block</text>
  <text x="1014" y="562" font-size="11" fill="#86303a">after 10 fails -&gt;</text>
  <text x="1014" y="580" font-size="11" fill="#86303a">needs-you.md; move on</text>

  <!-- arrows row 1 -->
  <line x1="250" y1="192" x2="278" y2="192" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="490" y1="192" x2="518" y2="192" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="730" y1="192" x2="758" y2="192" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="970" y1="192" x2="998" y2="192" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <!-- 3b -> 4 down -->
  <line x1="1105" y1="234" x2="1105" y2="328" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <!-- arrows row 2 (leftward) -->
  <line x1="1000" y1="372" x2="972" y2="372" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="760" y1="372" x2="732" y2="372" stroke="#57606a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- loop back 6 -> 0.5 -->
  <path d="M 520 360 C 360 320, 220 300, 150 236" fill="none" stroke="#0969da" stroke-width="1.8" marker-end="url(#ar-b)"/>
  <text x="300" y="300" font-size="12" fill="#0969da" font-weight="600">loop: continue immediately</text>

  <!-- branch: 5 -> 7 (failure) -->
  <line x1="865" y1="414" x2="865" y2="508" stroke="#cf222e" stroke-width="1.6" marker-end="url(#ar-r)"/>
  <text x="878" y="466" font-size="12" fill="#cf222e" font-weight="600">on failure</text>
  <!-- 7 -> 8 (10 fails) -->
  <line x1="970" y1="552" x2="998" y2="552" stroke="#cf222e" stroke-width="1.6" marker-end="url(#ar-r)"/>
  <!-- 7 -> 4 retry (new strategy) -->
  <path d="M 970 524 C 1012 512, 1034 470, 1040 418" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar-r)"/>
  <text x="1058" y="472" font-size="12" fill="#cf222e" font-weight="600">retry: new strategy</text>

  <!-- sleep + startup note -->
  <rect x="40" y="330" width="430" height="128" rx="10" fill="#fffaf0" stroke="#d4a72c" stroke-width="1.4"/>
  <text x="56" y="358" font-size="13.5" fill="#7d4e00" font-weight="700">Cadence: busy by default, sleep only when idle</text>
  <text x="56" y="382" font-size="12" fill="#5c4813">work done or failed -&gt; continue immediately (no sleep)</text>
  <text x="56" y="403" font-size="12" fill="#5c4813">no work in the queue -&gt; sleep 30s</text>
  <text x="56" y="424" font-size="12" fill="#5c4813">unhealthy, or rate-limit cooldown -&gt; sleep 60s</text>
  <text x="56" y="447" font-size="11.5" fill="#57606a" font-style="italic">On startup: reset stale in-progress steps, clean up orphan workers.</text>

  <!-- footer -->
  <line x1="40" y1="640" x2="1240" y2="640" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="666" font-size="12.5" fill="#57606a"><tspan font-weight="700" fill="#0550ae">Agentic phases</tspan> (3, 3b, 4, 5-read, 7) are LLM judgment calls; <tspan font-weight="700" fill="#1f2328">deterministic phases</tspan> (0.5, 1, 2, 5-check, 6, 8) are plain code: health, parsing, verifiers, state, limits.</text>
  <text x="40" y="690" font-size="12.5" fill="#57606a"><tspan font-weight="700" fill="#1f2328">No work is lost on restart:</tspan> goals, steps, and evidence live in files and append-only ledgers, never in memory. The loop re-reads them and resumes.</text>
  <text x="40" y="714" font-size="12.5" fill="#57606a"><tspan font-weight="700" fill="#cf222e">Failure is first-class:</tspan> a failed worker never kills the loop - the agent retries with a different strategy, diagnoses after 3, and blocks for a human after 10.</text>
</svg>
